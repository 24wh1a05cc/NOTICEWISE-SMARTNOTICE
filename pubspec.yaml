name: noticewise
description: "NoticeWise - SmartNotice: Intelligent Notice Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# ─── Runtime dependencies (alphabetical) ─────────────────────────────────────
dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  go_router: ^18.0.2
  hooks_riverpod: ^3.4.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  path: ^1.9.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6
  sqflite: ^2.4.2
  table_calendar: ^3.1.5
  timezone: ^0.9.4
  uuid: ^4.6.0

# ─── Dev dependencies (alphabetical) ─────────────────────────────────────────
dev_dependencies:
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9

# ─── Flutter configuration ────────────────────────────────────────────────────
flutter:
  uses-material-design: true
